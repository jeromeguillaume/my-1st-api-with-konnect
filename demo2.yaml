_format_version: "3.0"
_info:
  defaults: {}
  select_tags:
  - demo2
partials:
  - name: redis-france-dev
    type: redis-ee
    id: 85e91243-b735-41e1-bfd8-ba9950771d17
services:
- connect_timeout: 60000
  enabled: true
  host: httpbin.konghq.com
  name: httpbin
  plugins:
  - config:
      error_code: 429
      error_message: API rate limit exceeded
      limit:
      - 100
      redis:
        redis_proxy_type: null
      retry_after_jitter_max: 0
      strategy: redis
      sync_rate: 0
      window_size:
      - 3600
      window_type: fixed
    enabled: true
    name: rate-limiting-advanced
    partials:
    - id: 85e91243-b735-41e1-bfd8-ba9950771d17
      name: redis-france-dev
      path: config.redis
    protocols:
    - grpc
    - grpcs
    - http
    - https
    tags:
    - demo2
  port: 443
  protocol: https
  read_timeout: 60000
  retries: 5
  routes:
  - https_redirect_status_code: 426
    name: httpbin
    path_handling: v0
    paths:
    - /httpbin
    preserve_host: false
    protocols:
    - https
    regex_priority: 0
    request_buffering: true
    response_buffering: true
    strip_path: true
    tags:
    - demo2
  tags:
  - demo2
  write_timeout: 60000