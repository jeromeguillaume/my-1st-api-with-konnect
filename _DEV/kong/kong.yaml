    - GET
    name: my-1st-api_query
    paths:
    - ~/anything/query$
    plugins: []
    protocols:
    - https
    regex_priority: 200
    strip_path: false
    tags:
    - my-1st-api
    - platform-repo-managed
  - id: 40c8c4d7-4409-5d0f-ade6-08f2a56376d4
    methods:
    - GET
    name: my-1st-api_delay
    paths:
    - ~/delay/(?<delay_value>[^#?/]+)$
    plugins: []
    protocols:
    - https
    regex_priority: 100
    strip_path: false
    tags:
    - my-1st-api
    - platform-repo-managed
  - id: 512f6918-4f02-5783-adc3-e6b8cd3fd9d7
