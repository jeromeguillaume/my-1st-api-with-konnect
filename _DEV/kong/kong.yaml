services:
- host: httpbin.konghq.com
  id: ca2db6c4-b46e-5df6-9d11-6a19699b169b
  name: my-1st-api
  path: /
  plugins:
  - config:
      error_code: 429
      error_message: API rate limit exceeded
      identifier: consumer
      limit:
      - 10
      - 1000
      - 100000
      partials:
      - id: 85e91243-b735-41e1-bfd8-ba9950771d17
        name: redis-france-dev
        path: config.redis
      strategy: redis
      sync_rate: 0
      window_size:
      - 60
      - 3600
      - 86400
      window_type: fixed
    name: rate-limiting-advanced
    tags:
    - platform-repo-managed
  port: 443
  protocol: https
  routes:
  - id: 78dedd78-c275-5867-a73b-6a146146947f
    methods:
    - GET
    name: my-1st-api_anything-get
    paths:
    - ~/anything$
    plugins: []
    protocols:
    - https
    regex_priority: 200
    strip_path: false
    tags:
    - my-1st-api
    - platform-repo-managed
  - id: 12ff581c-6e9f-57da-8808-99df0abde5c2
    methods:
    - POST
    name: my-1st-api_anything-post
    paths:
    - ~/anything$
    plugins: []
    protocols:
    - https
    regex_priority: 200
    strip_path: false
    tags:
    - my-1st-api
    - platform-repo-managed
  - id: 2de908d4-b1d6-5dad-b313-25cc0e6feb80
