add-plugins:
  - selectors:
      - $..services[*]
    overwrite: yes
    plugins:
      - name: response-transformer
        config:
          add:
            headers:
              - "X-Engie-Security:passed"
      - name: key-auth
        config:
          key_names:
          - apikey
      - name: rate-limiting-advanced
        config:
          error_code: 429
          error_message: API rate limit exceeded
          limit:
          - 10
          - 1000
          - 10000
          window_size:
          - 60
          - 3600
          - 86400
          strategy: redis
          sync_rate: 0
          window_type: fixed
          namespace: ${{ env "DECK_KONNECT_REDIS_ID" }}-my-1st-api
        enabled: true
        partials:
        - id: ${{ env "DECK_KONNECT_REDIS_ID" }}
          name: ${{ env "DECK_KONNECT_REDIS_NAME" }}
          path: config.redis
