add-plugins:
  - selectors:
      - $..services[*]
    overwrite: yes
    plugins:
      - name: rate-limiting-advanced
        config:
          identifier: consumer
          error_code: 429
          error_message: API rate limit exceeded
          window_type: fixed
          window_size:
            - 60
            - 3600
            - 86400
          limit:
            - 10
            - 1000
            - 100000
          strategy: redis
          sync_rate: 0      
        partials:
        - id: 85e91243-b735-41e1-bfd8-ba9950771d17
          name: redis-france-dev
          path: config.redis