add-plugins:
  - selectors:
      - $..services[*]
    overwrite: yes
    plugins:
      - name: response-transformer
        config:
          add:
            headers:
              - "X-Engie-Security:passed"
      - name: rate-limiting-advanced
        config:
          error_code: 429
          error_message: API rate limit exceeded
          limit:
          - 10
          - 1000
          - 10000
          window_size:
          - 60
          - 3600
          - 86400
          redis:
            redis_proxy_type: null
          retry_after_jitter_max: 0
          strategy: redis
          sync_rate: 0
          window_type: fixed
        enabled: true
        partials:
        - id: 85e91243-b735-41e1-bfd8-ba9950771d17
          name: redis-france-dev
          path: config.redis
